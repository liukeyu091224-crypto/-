
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>to coco ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .heartbeat-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .trace {
      fill: none;
      stroke: white;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trace-glow {
      fill: none;
      stroke: white;
      stroke-width: 7;
      opacity: 0.55;
      filter: blur(5px);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trace-soft {
      fill: none;
      stroke: white;
      stroke-width: 13;
      opacity: 0.16;
      filter: blur(10px);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .light-dot {
      fill: white;
      filter: drop-shadow(0 0 5px white);
    }

    .light-halo {
      fill: white;
      opacity: 0.55;
      filter: blur(7px);
    }

    .caption {
      position: absolute;
      bottom: 7%;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: "Great Vibes", "Brush Script MT", cursive;
      font-size: clamp(38px, 5vw, 64px);
      color: #ffd6e5;
      text-shadow:
        0 0 5px #ffb4cf,
        0 0 13px #ff83b1,
        0 0 28px rgba(255, 105, 170, 0.45);
      pointer-events: none;
      user-select: none;
    }

    #sparkLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .spark {
      position: absolute;
      width: 16px;
      height: 16px;
      overflow: visible;
      color: #ff85b8;
      opacity: 0;
      filter:
        drop-shadow(0 0 5px #ff85b8)
        drop-shadow(0 0 12px rgba(255, 85, 150, 0.8));
      animation: sparkle 1.3s ease-in-out forwards;
    }

    .spark svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    @keyframes sparkle {
      0% {
        opacity: 0;
        transform: scale(0.35);
      }
      25% {
        opacity: 1;
        transform: scale(1.1);
      }
      50% {
        opacity: 0.85;
        transform: scale(0.95);
      }
      100% {
        opacity: 0;
        transform: scale(0.3);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spark {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="scene">

    <div id="sparkLayer"></div>

    <svg class="heartbeat-svg"
         viewBox="0 0 1200 700"
         preserveAspectRatio="xMidYMid meet">

      <path id="soft" class="trace-soft"></path>
      <path id="glow" class="trace-glow"></path>
      <path id="line" class="trace"></path>

      <circle id="halo" class="light-halo" r="10"></circle>
      <circle id="dot" class="light-dot" r="2.8"></circle>
    </svg>

    <div class="caption">to coco</div>
  </div>

  <script>
    // ===================================
    // ECG: sharp peaks, thin glowing line
    // ===================================

    const ECG_LEFT = `
      M 25 370
      L 125 370

      L 152 370
      L 164 352
      L 174 382
      L 192 205
      L 211 485
      L 229 350
      L 242 374
      L 258 320
      L 272 368
      L 289 355
      L 305 370

      L 410 370
    `;

    const ECG_RIGHT = `
      L 905 370

      L 929 370
      L 943 346
      L 954 385
      L 972 211
      L 991 477
      L 1009 352
      L 1022 374
      L 1039 328
      L 1054 369
      L 1070 355
      L 1084 370

      L 1175 370
    `;

    // ===================================
    // Heart:
    // upright, rounded upper lobes;
    // pointed bottom touches baseline.
    // ===================================

    const HEART = `
      L 446 370

      C 448 319, 470 257, 505 225
      C 534 197, 572 202, 598 233
      C 620 259, 630 299, 646 327

      C 663 299, 674 259, 697 233
      C 724 202, 762 197, 792 225
      C 828 257, 847 319, 847 370

      C 823 416, 742 470, 646 524
      C 554 470, 471 416, 446 370

      L 905 370
    `;

    // This is an open heart outline that travels
    // down to its bottom tip and returns to ECG.
    // The shape stays distinct from the cat ears.

    const HEART_CONTINUOUS = `
      L 455 370

      C 448 333, 456 287, 480 254
      C 506 216, 542 205, 569 217
      C 603 229, 628 269, 647 302

      C 666 269, 690 229, 724 217
      C 751 205, 788 216, 814 254
      C 837 287, 844 333, 837 370

      C 825 412, 751 465, 647 526
      C 543 465, 467 412, 455 370

      L 905 370
    `;

    // ===================================
    // Cat ears:
    // short, rounded, cute ears only.
    // No full face or long cheeks.
    // ===================================

    const CAT = `
      L 490 370

      C 509 370, 519 343, 527 319
      C 537 290, 542 268, 555 249

      Q 561 241, 567 253
      C 581 280, 595 304, 611 322

      C 629 319, 658 319, 679 322

      C 695 304, 709 280, 723 253
      Q 729 241, 735 249

      C 748 268, 753 290, 763 319
      C 771 343, 781 370, 800 370

      L 905 370
    `;

    // ===================================
    // Keep only the correct central path:
    // heart and cat alternate each cycle.
    // ===================================

    const HEART_PATH =
      ECG_LEFT + HEART_CONTINUOUS + ECG_RIGHT;

    const CAT_PATH =
      ECG_LEFT + CAT + ECG_RIGHT;

    const PATHS = [HEART_PATH, CAT_PATH];

    const line = document.getElementById("line");
    const glow = document.getElementById("glow");
    const soft = document.getElementById("soft");
    const dot = document.getElementById("dot");
    const halo = document.getElementById("halo");

    // Animation timing
    const DURATION = 1500;
    const TAIL_MS = 560;

    let startTime = null;
    let currentCycle = -1;
    let totalLength = 0;

    function changeShape(index) {
      const d = PATHS[index];

      line.setAttribute("d", d);
      glow.setAttribute("d", d);
      soft.setAttribute("d", d);

      totalLength = line.getTotalLength();
    }

    function drawSegment(path, from, to) {
      const length = Math.max(0.01, to - from);

      path.style.strokeDasharray =
        `${length} ${totalLength + 1}`;

      path.style.strokeDashoffset = -from;
    }

    function animate(timestamp) {
      if (startTime === null) startTime = timestamp;

      const elapsed = timestamp - startTime;
      const cycle = Math.floor(elapsed / DURATION);
      const currentTime = elapsed % DURATION;
      const progress = currentTime / DURATION;

      if (cycle !== currentCycle) {
        currentCycle = cycle;
        changeShape(cycle % 2);
      }

      // Constant travel speed along the SVG.
      const head = totalLength * progress;

      // Moving tail, fading behind the head.
      const tailProgress =
        Math.max(0, (currentTime - TAIL_MS) / DURATION);

      const tail = totalLength * tailProgress;

      drawSegment(soft, tail, head);
      drawSegment(glow, tail, head);
      drawSegment(line, tail, head);

      const point = line.getPointAtLength(head);

      dot.setAttribute("cx", point.x);
      dot.setAttribute("cy", point.y);

      halo.setAttribute("cx", point.x);
      halo.setAttribute("cy", point.y);

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // ===================================
    // Pink filled hearts:
    // flash once, disappear, change place.
    // ===================================

    const sparkLayer = document.getElementById("sparkLayer");

    const heartSVG = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21
          C10 19.4 2 13.4 2 7.7
          C2 4.5 4.4 2.5 7.4 2.5
          C9.4 2.5 11 3.5 12 5
          C13 3.5 14.6 2.5 16.6 2.5
          C19.6 2.5 22 4.5 22 7.7
          C22 13.4 14 19.4 12 21Z"/>
      </svg>
    `;

    function spawnHeart() {
      const spark = document.createElement("div");
      spark.className = "spark";
      spark.innerHTML = heartSVG;

      const size = 9 + Math.random() * 10;
      const x = 5 + Math.random() * 90;

      // Keep particles away from the main waveform
      // and the bottom caption.
      const y = Math.random() < 0.5
        ? 7 + Math.random() * 19
        : 70 + Math.random() * 13;

      spark.style.left = `${x}%`;
      spark.style.top = `${y}%`;
      spark.style.width = `${size}px`;
      spark.style.height = `${size}px`;

      sparkLayer.appendChild(spark);

      spark.addEventListener("animationend", () => {
        spark.remove();
      }, { once: true });
    }

    // Irregular timings give a star-like effect.
    function scheduleNextHeart() {
      spawnHeart();

      const nextDelay = 500 + Math.random() * 950;
      setTimeout(scheduleNextHeart, nextDelay);
    }

    setTimeout(scheduleNextHeart, 350);
  </script>
</body>
</html>
