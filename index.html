<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>to coco</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      background: #000;
      font-family: sans-serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 非常淡的残影底线 */
    .ghost-line {
      fill: none;
      stroke: rgba(255,255,255,0.08);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: blur(0.4px);
    }

    /* 主发光拖尾 - 外层光 */
    .tail-glow {
      fill: none;
      stroke: rgba(255,255,255,0.22);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: blur(5px);
    }

    /* 主发光拖尾 - 中层光 */
    .tail-mid {
      fill: none;
      stroke: rgba(255,255,255,0.38);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: blur(2px);
    }

    /* 主线核心：细白线 */
    .tail-core {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dot-glow {
      fill: rgba(255,255,255,0.95);
      filter: blur(6px);
    }

    .dot-core {
      fill: #ffffff;
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 30px;
      text-align: center;
      font-family: "Great Vibes", cursive;
      font-size: clamp(34px, 4vw, 60px);
      color: #ffd7e6;
      letter-spacing: 0.5px;
      text-shadow:
        0 0 8px rgba(255, 170, 205, 0.85),
        0 0 16px rgba(255, 150, 190, 0.55),
        0 0 28px rgba(255, 120, 170, 0.28);
      user-select: none;
      pointer-events: none;
    }

    /* 随机出现的小爱心容器 */
    #sparkLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .spark-heart {
      position: absolute;
      width: 14px;
      height: 14px;
      transform: rotate(-45deg) scale(0.75);
      background: #ff82b3;
      border-radius: 3px;
      opacity: 0;
      box-shadow:
        0 0 8px rgba(255, 120, 170, 0.9),
        0 0 18px rgba(255, 120, 170, 0.55),
        0 0 30px rgba(255, 120, 170, 0.28);
      animation: heartFlash 1.5s ease-out forwards;
    }

    .spark-heart::before,
    .spark-heart::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ff82b3;
      border-radius: 50%;
      box-shadow:
        0 0 8px rgba(255, 120, 170, 0.9),
        0 0 18px rgba(255, 120, 170, 0.55),
        0 0 30px rgba(255, 120, 170, 0.28);
    }

    .spark-heart::before {
      left: 0;
      top: -7px;
    }

    .spark-heart::after {
      left: 7px;
      top: 0;
    }

    @keyframes heartFlash {
      0% {
        opacity: 0;
        transform: rotate(-45deg) scale(0.55);
      }
      20% {
        opacity: 1;
        transform: rotate(-45deg) scale(0.95);
      }
      55% {
        opacity: 0.9;
        transform: rotate(-45deg) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: rotate(-45deg) scale(0.75);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div id="sparkLayer"></div>

    <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
      <!-- 淡残影 -->
      <path id="ghostPath" class="ghost-line"></path>

      <!-- 三层拖尾 -->
      <path id="tailGlow" class="tail-glow"></path>
      <path id="tailMid" class="tail-mid"></path>
      <path id="tailCore" class="tail-core"></path>

      <!-- 小光点 -->
      <circle id="dotGlow" class="dot-glow" r="7"></circle>
      <circle id="dotCore" class="dot-core" r="2.5"></circle>
    </svg>

    <div class="caption">to coco</div>
  </div>

  <script>
    // =========================
    // 路径：更精致的爱心 + 可爱猫耳朵
    // =========================

    const HEART_PATH = `
      M 40 350
      L 148 350

      L 166 350
      L 182 306
      L 196 380
      L 216 168
      L 236 505
      L 254 328
      L 270 360
      L 287 282
      L 304 340
      L 322 316
      L 340 350

      L 480 350

      C 500 350, 512 314, 530 286
      C 548 258, 575 236, 605 238
      C 630 240, 648 258, 660 286

      C 672 258, 690 240, 715 238
      C 745 236, 772 258, 790 286
      C 808 314, 820 350, 840 350

      L 948 350

      L 965 314
      L 982 392
      L 1000 212
      L 1018 470
      L 1036 330
      L 1054 350
      L 1160 350
    `;

    const CAT_PATH = `
      M 40 350
      L 148 350

      L 166 350
      L 182 306
      L 196 380
      L 216 168
      L 236 505
      L 254 328
      L 270 360
      L 287 282
      L 304 340
      L 322 316
      L 340 350

      L 500 350

      C 522 350, 535 310, 545 252
      C 553 205, 565 155, 580 116
      C 594 146, 610 188, 628 236

      C 639 262, 651 276, 660 278

      C 669 276, 681 262, 692 236
      C 710 188, 726 146, 740 116
      C 755 155, 767 205, 775 252
      C 785 310, 798 350, 820 350

      L 948 350

      L 965 314
      L 982 392
      L 1000 212
      L 1018 470
      L 1036 330
      L 1054 350
      L 1160 350
    `;

    const PATHS = [HEART_PATH, CAT_PATH];

    const ghostPath = document.getElementById("ghostPath");
    const tailGlow = document.getElementById("tailGlow");
    const tailMid = document.getElementById("tailMid");
    const tailCore = document.getElementById("tailCore");
    const dotGlow = document.getElementById("dotGlow");
    const dotCore = document.getElementById("dotCore");
    const sparkLayer = document.getElementById("sparkLayer");

    // 节奏：在原来基础上 +0.1s
    const DURATION = 1600;

    // 拖尾保留时间：不要太短，也不要太慢
    const TAIL_MS = 560;

    let startTime = null;
    let currentPathIndex = -1;

    function applyPath(d) {
      ghostPath.setAttribute("d", d);
      tailGlow.setAttribute("d", d);
      tailMid.setAttribute("d", d);
      tailCore.setAttribute("d", d);
    }

    function setSegment(pathEl, totalLength, fromLen, toLen) {
      const visible = Math.max(0.001, toLen - fromLen);
      pathEl.style.strokeDasharray = `${visible} ${totalLength}`;
      pathEl.style.strokeDashoffset = -fromLen;
    }

    function easeOut(t) {
      return 1 - Math.pow(1 - t, 2.4);
    }

    function animate(now) {
      if (!startTime) startTime = now;

      const elapsed = now - startTime;
      const cycle = Math.floor(elapsed / DURATION);
      const t = (elapsed % DURATION) / DURATION;

      const pathIndex = cycle % PATHS.length;

      if (pathIndex !== currentPathIndex) {
        currentPathIndex = pathIndex;
        applyPath(PATHS[pathIndex]);
      }

      const totalLength = tailCore.getTotalLength();

      const headProgress = easeOut(t);
      const headLen = totalLength * headProgress;

      const tailProgressRaw = Math.max(0, (elapsed % DURATION) - TAIL_MS) / DURATION;
      const tailProgress = easeOut(Math.min(tailProgressRaw, 1));
      const tailLen = totalLength * tailProgress;

      setSegment(tailGlow, totalLength, tailLen, headLen);
      setSegment(tailMid, totalLength, tailLen, headLen);
      setSegment(tailCore, totalLength, tailLen, headLen);

      const p = tailCore.getPointAtLength(Math.min(headLen, totalLength));
      dotGlow.setAttribute("cx", p.x);
      dotGlow.setAttribute("cy", p.y);
      dotCore.setAttribute("cx", p.x);
      dotCore.setAttribute("cy", p.y);

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // =========================
    // 随机闪烁小爱心：闪完就消失，换地方再出现
    // =========================

    function spawnSparkHeart() {
      const heart = document.createElement("div");
      heart.className = "spark-heart";

      // 尽量避开底部文字区域 & 中心主路径过密区域
      const x = Math.random() * 88 + 4;     // 4% ~ 92%
      const yPool = Math.random();
      let y;

      if (yPool < 0.5) {
        y = Math.random() * 22 + 8;         // 上方
      } else {
        y = Math.random() * 28 + 56;        // 下方但避开底部文字
      }

      const size = Math.random() * 8 + 8;   // 8 ~ 16px

      heart.style.left = `${x}%`;
      heart.style.top = `${y}%`;
      heart.style.width = `${size}px`;
      heart.style.height = `${size}px`;

      sparkLayer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 1600);
    }

    // 初始先来几颗，后面随机补
    setTimeout(spawnSparkHeart, 300);
    setTimeout(spawnSparkHeart, 900);
    setTimeout(spawnSparkHeart, 1500);

    setInterval(() => {
      spawnSparkHeart();
    }, 900);
  </script>
</body>
</html>
